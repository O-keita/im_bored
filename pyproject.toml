[project]
name = "gambia-fire-calendar"
version = "0.1.0"
description = "A harmonized MODIS and VIIRS burning activity calendar for The Gambia (NASA Space Apps 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "geopandas>=1.0",
    "shapely>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firecal"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
